<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando...</title>
    <script>
      const basePath = "/hora-do-foco/";
      const requestedPath = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace(basePath + "?p=" + encodeURIComponent(requestedPath));
    </script>
  </head>
  <body>
    <p>Redirecionando para o Hora do Foco...</p>
  </body>
</html>
